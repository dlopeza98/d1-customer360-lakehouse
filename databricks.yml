# ===========================================================================
# Databricks Asset Bundle · 1531 D1 — Customer 360 & Golden Record
#
# ESTE ES EL ARCHIVO DEL DEMO.
#
# Todo el proyecto — notebooks, jobs, reglas de identidad — es agnóstico de
# nube. La única conciencia de dónde corre está en el bloque `targets` de
# abajo: dos líneas, una por nube.
#
# Mover el POC de Azure a GCP es cambiar el target:
#     databricks bundle deploy -t azure
#     databricks bundle deploy -t gcp
#
# O, en el pipeline: hacer merge de develop a main.
# ===========================================================================

bundle:
  name: d1_customer360

variables:
  catalogo:
    description: Catálogo de Unity Catalog del dominio Cliente.
    default: d1_customer360

  n_personas:
    description: Tamaño del universo sintético.
    default: "5000"

  nodos:
    description: Nodos del cluster.
    default: 2

targets:
  # --- Nube de EJECUCIÓN del POC -------------------------------------------
  azure:
    default: true
    mode: development
    workspace:
      host: https://adb-0000000000000000.0.azuredatabricks.net

  # --- Nube de DESTINO · Fase 8 --------------------------------------------
  gcp:
    mode: development
    workspace:
      host: https://0000000000000000.0.gcp.databricks.com

# Los hosts reales se inyectan con DATABRICKS_HOST desde los secrets de
# GitHub Actions: no se versionan URLs de workspaces del cliente.

include:
  - resources/*.yml

sync:
  include:
    - jobs/reglas_identidad.json   # las reglas viajan al workspace como archivo
