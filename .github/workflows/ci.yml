# CI — corre en cada push y cada pull request.
# Responde una sola pregunta: ¿este cambio sirve en las DOS nubes?
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  validar:
    name: Jobs y portabilidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Valida los JSON de jobs/ y los convierte a resources/*.yml.
      - name: Definiciones de job
        run: python scripts/build_resources.py --check

      # Si alguien escribe una ruta de nube dentro de un notebook, el build
      # falla. La portabilidad deja de ser una intención y pasa a ser un test.
      - name: Portabilidad entre nubes
        run: bash scripts/verificar_portabilidad.sh
