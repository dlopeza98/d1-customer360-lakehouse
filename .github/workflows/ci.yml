# CI — corre en cada push y cada pull request.
# No despliega nada. Responde una sola pregunta: ¿este cambio es desplegable
# en las DOS nubes?
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  jobs_validos:
    name: Definiciones de job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Valida los JSON: campos de la Jobs API, dependencias que existen,
      # clusters declarados y notebooks presentes en el repo.
      - name: Validar jobs/*.json y generar resources/
        run: python scripts/build_resources.py --check

      - name: Publicar los recursos generados
        uses: actions/upload-artifact@v4
        with:
          name: resources
          path: resources/

  reglas_validas:
    name: Catálogo de reglas de identidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar el catálogo de reglas
        run: python scripts/validar_reglas.py

  portabilidad:
    name: Portabilidad entre nubes (RNF-017)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Si alguien escribe una ruta de nube dentro de un notebook, el build
      # falla. La portabilidad deja de ser una intención y pasa a ser un test.
      - name: Ningún notebook puede nombrar una nube
        run: bash scripts/verificar_portabilidad.sh

  precondiciones:
    name: ¿Hay workspaces configurados?
    runs-on: ubuntu-latest
    outputs:
      hay_workspace: ${{ steps.check.outputs.hay_workspace }}
    steps:
      # El contexto `secrets` no se puede leer en un `if` a nivel de job, así
      # que se resuelve aquí y se expone como output.
      - id: check
        env:
          HOST_AZURE: ${{ secrets.DATABRICKS_HOST_AZURE }}
          HOST_GCP: ${{ secrets.DATABRICKS_HOST_GCP }}
          CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
        run: |
          if [ -n "$HOST_AZURE" ] && [ -n "$HOST_GCP" ] && [ -n "$CLIENT_ID" ]; then
            echo "hay_workspace=true" >> "$GITHUB_OUTPUT"
            echo "Workspaces configurados: se valida el bundle contra ambos." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "hay_workspace=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Validación del bundle omitida"
              echo ""
              echo "No hay secrets de Databricks configurados, así que no hay contra"
              echo "qué autenticarse. Los validadores que no necesitan workspace"
              echo "—jobs, reglas y portabilidad— sí corrieron."
              echo ""
              echo "Para habilitarla, configurar: \`DATABRICKS_HOST_AZURE\`,"
              echo "\`DATABRICKS_HOST_GCP\`, \`DATABRICKS_CLIENT_ID\`,"
              echo "\`DATABRICKS_CLIENT_SECRET\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  bundle:
    name: Bundle en ambos targets
    runs-on: ubuntu-latest
    needs: [jobs_validos, precondiciones]
    if: needs.precondiciones.outputs.hay_workspace == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [dev, gcp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: databricks/setup-cli@main

      - name: Generar recursos
        run: python scripts/build_resources.py

      - name: databricks bundle validate
        env:
          DATABRICKS_HOST: ${{ matrix.target == 'dev' && secrets.DATABRICKS_HOST_AZURE || secrets.DATABRICKS_HOST_GCP }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: databricks bundle validate -t ${{ matrix.target }}
